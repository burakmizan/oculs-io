# ============================================================
# Oculs.io — Security Scan Workflow
# Orchestrates all 20 tools across SAST / Secrets / Infra / DAST
# and POSTs structured findings to the Oculs webhook endpoint.
#
# Required repository secrets:
#   OCULS_WEBHOOK_URL    — https://your-app.vercel.app/api/webhook/scan
#   OCULS_WEBHOOK_SECRET — must match GITHUB_WEBHOOK_SECRET in Vercel env
#
# Optional repository secrets (for DAST jobs):
#   TARGET_URL           — live URL to scan (e.g. https://your-app.vercel.app)
#   SONAR_TOKEN          — SonarCloud token (sonarscanner job)
#   SONAR_HOST_URL       — SonarCloud host (default: https://sonarcloud.io)
# ============================================================

name: Oculs Security Scan

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: "Oculs scan UUID (from dashboard queue)"
        required: true
        type: string
      tools:
        description: "Comma-separated tool list (leave empty = run all)"
        required: false
        default: ""
      target_url:
        description: "Target URL for DAST tools"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCAN_ID: ${{ github.event.inputs.scan_id }}
  REPO:    ${{ github.repository }}
  BRANCH:  ${{ github.ref_name }}
  SHA:     ${{ github.sha }}
  # Safe-by-design: the target URL lives in an env var, never interpolated
  # directly into a run: shell — prevents GitHub Actions script injection (CWE-78).
  TARGET_URL_INPUT: ${{ github.event.inputs.target_url || secrets.TARGET_URL }}

# ────────────────────────────────────────────────────────────
# Notify webhook that the scan has started
# ────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — scan.started
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: POST scan.started
        run: |
          # Only POST if SCAN_ID is a valid UUID (workflow_dispatch from dashboard)
          if ! echo "$SCAN_ID" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "SCAN_ID is not a valid UUID ('$SCAN_ID') — skipping webhook"
            exit 0
          fi
          curl -fsSL -X POST "${{ secrets.OCULS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Oculs-Signature-256: sha256=$(echo -n '{"event":"scan.started","scanId":"'"$SCAN_ID"'","repository":"'"$REPO"'","branch":"'"$BRANCH"'","commitSha":"'"$SHA"'"}' | openssl dgst -sha256 -hmac '${{ secrets.OCULS_WEBHOOK_SECRET }}' | awk '{print $2}')" \
            -d '{"event":"scan.started","scanId":"'"$SCAN_ID"'","repository":"'"$REPO"'","branch":"'"$BRANCH"'","commitSha":"'"$SHA"'"}'

# ============================================================
# SAST JOBS
# ============================================================

  # ── 1. Semgrep ──────────────────────────────────────────
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Detect languages and run Semgrep
        id: scan
        run: |
          # Detect project languages
          HAS_JS=$(find . -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" | grep -v node_modules | head -1)
          HAS_PY=$(find . -name "*.py" | grep -v node_modules | head -1)
          HAS_GO=$(find . -name "*.go" | grep -v node_modules | head -1)
          HAS_JAVA=$(find . -name "*.java" | grep -v node_modules | head -1)
          HAS_PHP=$(find . -name "*.php" | grep -v node_modules | head -1)
          HAS_RUBY=$(find . -name "*.rb" | grep -v node_modules | head -1)
          HAS_RUST=$(find . -name "*.rs" | grep -v node_modules | head -1)
          HAS_C=$(find . -name "*.c" -o -name "*.cpp" -o -name "*.h" | grep -v node_modules | head -1)

          # Build config args based on detected languages
          CONFIGS="--config auto --config p/security-audit --config p/secrets --config p/owasp-top-ten"

          if [ -n "$HAS_JS" ]; then
            CONFIGS="$CONFIGS --config p/javascript --config p/typescript --config p/nodejs --config p/react --config p/nextjs"
          fi
          if [ -n "$HAS_PY" ]; then
            CONFIGS="$CONFIGS --config p/python --config p/django --config p/flask"
          fi
          if [ -n "$HAS_GO" ]; then
            CONFIGS="$CONFIGS --config p/golang"
          fi
          if [ -n "$HAS_JAVA" ]; then
            CONFIGS="$CONFIGS --config p/java --config p/spring"
          fi
          if [ -n "$HAS_PHP" ]; then
            CONFIGS="$CONFIGS --config p/php"
          fi
          if [ -n "$HAS_RUBY" ]; then
            CONFIGS="$CONFIGS --config p/ruby --config p/rails"
          fi
          if [ -n "$HAS_RUST" ]; then
            CONFIGS="$CONFIGS --config p/rust"
          fi
          if [ -n "$HAS_C" ]; then
            CONFIGS="$CONFIGS --config p/c"
          fi

          echo "[semgrep] Detected languages, running with configs: $CONFIGS"

          semgrep scan \
            $CONFIGS \
            --json \
            --output semgrep-results.json \
            --timeout 180 \
            --max-memory 2000 \
            --exclude-rule "generic.secrets.security.detected-generic-secret.detected-generic-secret" \
            . || true

          # Print finding count
          python3 -c "
          import json
          try:
              d = json.load(open('semgrep-results.json'))
              print(f'[semgrep] Found {len(d.get(\"results\", []))} findings')
          except: pass
          " || true

      - name: Normalise & POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request, re

          # Skip if no valid UUID scan_id
          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[semgrep] No valid SCAN_ID ({scan_id!r}), skipping webhook POST")
              import sys; sys.exit(0)

          try:
              with open("semgrep-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {"results": []}

          # Semgrep severity mapping — covers both old and new formats
          SEV_MAP = {
              "ERROR":    "high",
              "WARNING":  "medium",
              "INFO":     "info",
              "HIGH":     "high",
              "MEDIUM":   "medium",
              "LOW":      "low",
              "CRITICAL": "critical",
          }

          findings = []
          seen = set()  # deduplicate exact same rule+file+line

          for r in data.get("results", []):
              check_id   = r.get("check_id", "")
              file_path  = r.get("path", "")
              line_start = r.get("start", {}).get("line")

              # Dedup key
              dedup_key = f"{check_id}::{file_path}::{line_start}"
              if dedup_key in seen:
                  continue
              seen.add(dedup_key)

              extra    = r.get("extra", {})
              metadata = extra.get("metadata", {})

              # Title: prefer human message, fall back to rule last segment
              message  = extra.get("message", "").strip()
              rule_name = check_id.split(".")[-1].replace("-", " ").replace("_", " ").title()
              title = message[:120] if message else rule_name

              # Severity: check extra.severity first, then extra.metadata.severity
              sev_raw = (
                  extra.get("severity") or
                  metadata.get("severity") or
                  "WARNING"
              ).upper()
              severity = SEV_MAP.get(sev_raw, "medium")

              # CWE from metadata
              cwe_raw = metadata.get("cwe") or metadata.get("cwe-id") or ""
              if isinstance(cwe_raw, list):
                  cwe_raw = cwe_raw[0] if cwe_raw else ""
              cwe_id = str(cwe_raw).strip()

              # OWASP from metadata
              owasp_raw = metadata.get("owasp") or metadata.get("owasp-top-10") or ""
              if isinstance(owasp_raw, list):
                  owasp_raw = owasp_raw[0] if owasp_raw else ""

              findings.append({
                  "tool":        "semgrep",
                  "ruleId":      check_id,
                  "title":       title,
                  "description": message[:500],
                  "severity":    severity,
                  "filePath":    file_path,
                  "lineStart":   line_start,
                  "lineEnd":     r.get("end", {}).get("line"),
                  "codeSnippet": extra.get("lines", "")[:400],
                  "cweId":       cwe_id,
                  "owaspCategory": str(owasp_raw)[:100],
                  "references":  [metadata.get("source", metadata.get("references", ""))],
              })

          print(f"[semgrep] Sending {len(findings)} findings (deduplicated)")

          payload = json.dumps({
              "event":     "scan.completed",
              "scanId":    scan_id,
              "repository": os.environ["REPO"],
              "branch":    os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings":  findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()

          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"[semgrep] Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 2. Gitleaks ─────────────────────────────────────────
  gitleaks:
    name: Secrets — Gitleaks
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks & Export JSON
        run: |
          # Run with git history scanning (--no-git removed)
          # fetch-depth: 0 above ensures full history is available
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo \
            --config="/repo/.gitleaks.toml" \
            --report-format json \
            --report-path /repo/gitleaks-results.json \
            --log-opts="--all" \
            --redact \
            --verbose || true
          sudo chmod 777 gitleaks-results.json || true
          echo "[gitleaks] Result size: $(wc -c < gitleaks-results.json 2>/dev/null || echo 0) bytes"

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          try:
              with open("gitleaks-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = []

          import re
          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[gitleaks] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          # Severity based on secret type
          HIGH_RULES = {"aws", "gcp", "azure", "github", "stripe", "twilio", "sendgrid", "private-key", "rsa"}
          findings = []
          seen_commits = set()

          for r in (data if isinstance(data, list) else []):
              rule_id = r.get("RuleID", "")
              commit  = r.get("Commit", "")
              file_p  = r.get("File", "")
              line    = r.get("StartLine")

              # Dedup same secret found in multiple commits
              dedup_key = f"{rule_id}::{file_p}::{r.get('Match', '')[:50]}"
              if dedup_key in seen_commits:
                  continue
              seen_commits.add(dedup_key)

              # Higher severity for cloud credentials and private keys
              sev = "critical" if any(k in rule_id.lower() for k in HIGH_RULES) else "high"

              desc_parts = []
              if commit: desc_parts.append(f"Commit: {commit[:8]}")
              if r.get("Author"): desc_parts.append(f"Author: {r['Author']}")
              if r.get("Date"): desc_parts.append(f"Date: {r['Date'][:10]}")

              findings.append({
                  "tool":        "gitleaks",
                  "ruleId":      rule_id,
                  "title":       f"Secret: {r.get('Description', rule_id)}",
                  "description": " | ".join(desc_parts),
                  "severity":    sev,
                  "filePath":    file_p,
                  "lineStart":   line,
                  "lineEnd":     r.get("EndLine"),
                  "codeSnippet": r.get("Match", "")[:200],
                  "cweId":       "CWE-798",
              })

          print(f"[gitleaks] Sending {len(findings)} findings")

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": scan_id,
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()

          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── TruffleHog — deep secret scanning with git history ─────────────────
  trufflehog:
    name: Secrets — TruffleHog
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        run: |
          # TruffleHog v3 — scans git history for verified secrets
          docker run --rm \
            -v "$PWD:/repo" \
            trufflesecurity/trufflehog:latest \
            git file:///repo \
            --json \
            --no-update \
            --only-verified \
            > trufflehog-results.json 2>/dev/null || true
          echo "[trufflehog] Result lines: $(wc -l < trufflehog-results.json 2>/dev/null || echo 0)"

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request, re

          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[trufflehog] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          findings = []
          # TruffleHog outputs one JSON object per line (NDJSON format)
          try:
              with open("trufflehog-results.json") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          r = json.loads(line)
                      except Exception:
                          continue
                      detector = r.get("DetectorName", "unknown")
                      verified = r.get("Verified", False)
                      source_meta = r.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
                      file_path = source_meta.get("file", "")
                      commit = source_meta.get("commit", "")
                      # Only verified = real credentials, not just pattern matches
                      sev = "critical" if verified else "high"
                      findings.append({
                          "tool": "gitleaks",  # grouped with secrets tools in UI
                          "ruleId": f"trufflehog-{detector}",
                          "title": f"Verified secret: {detector}",
                          "description": f"TruffleHog detected a verified {detector} credential. Commit: {commit[:8] if commit else 'unknown'}",
                          "severity": sev,
                          "filePath": file_path or None,
                          "lineStart": None,
                          "cweId": "CWE-798",
                      })
          except Exception as e:
              print(f"[trufflehog] Parse error: {e}")

          print(f"[trufflehog] Sending {len(findings)} findings")

          payload = json.dumps({
              "event":      "scan.completed",
              "scanId":     scan_id,
              "repository": os.environ["REPO"],
              "branch":     os.environ["BRANCH"],
              "commitSha":  os.environ["SHA"],
              "findings":   findings,
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"[trufflehog] Webhook: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 3. Trivy ─────────────────────────────────────────────
  trivy:
    name: Infra — Trivy
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (filesystem + secrets + IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: json
          output: trivy-results.json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.next,dist,.git
          # Skip the env template so Trivy's secret scanner stops flagging
          # AWS documentation example keys as real secrets.
          skip-files: .env.example
          # Drop vulnerabilities that have no fix available (pure noise) and
          # honour the curated ignore list of already-patched / non-applicable CVEs.
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          try:
              with open("trivy-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {"Results": []}

          import re
          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[trivy] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          sev_map = {"CRITICAL":"critical","HIGH":"high","MEDIUM":"medium","LOW":"low","UNKNOWN":"info"}
          findings = []

          for result in data.get("Results", []):
              target = result.get("Target", "")
              result_type = result.get("Type", "")

              # ── Vulnerabilities (dependencies) ──
              for v in result.get("Vulnerabilities") or []:
                  cvss = ""
                  cvss_data = v.get("CVSS", {})
                  for source in ("nvd", "ghsa", "redhat"):
                      score = cvss_data.get(source, {}).get("V3Score")
                      if score:
                          cvss = str(score)
                          break

                  findings.append({
                      "tool":        "trivy",
                      "ruleId":      v.get("VulnerabilityID", ""),
                      "title":       v.get("Title") or v.get("VulnerabilityID", "Trivy vulnerability"),
                      "description": v.get("Description", "")[:500],
                      "severity":    sev_map.get(v.get("Severity", "UNKNOWN"), "medium"),
                      "filePath":    target,
                      "cvssScore":   cvss,
                      "cweId":       v.get("CweIDs", [""])[0] if v.get("CweIDs") else "",
                      "references":  v.get("References", [])[:3],
                  })

              # ── Secrets ──
              for s in result.get("Secrets") or []:
                  findings.append({
                      "tool":        "trivy",
                      "ruleId":      s.get("RuleID", "secret"),
                      "title":       f"Secret: {s.get('Title', s.get('Category', 'Exposed secret'))}",
                      "description": f"Secret found in {target}",
                      "severity":    sev_map.get(s.get("Severity", "HIGH"), "high"),
                      "filePath":    target,
                      "lineStart":   s.get("StartLine"),
                      "lineEnd":     s.get("EndLine"),
                      "codeSnippet": s.get("Match", "")[:200],
                      "cweId":       "CWE-798",
                  })

              # ── Misconfigurations (IaC) ──
              for m in result.get("Misconfigurations") or []:
                  if m.get("Status") == "PASS":
                      continue
                  findings.append({
                      "tool":        "trivy",
                      "ruleId":      m.get("ID", "misconfig"),
                      "title":       m.get("Title", "Misconfiguration"),
                      "description": m.get("Description", "")[:500],
                      "severity":    sev_map.get(m.get("Severity", "MEDIUM"), "medium"),
                      "filePath":    target,
                      "cweId":       "",
                      "references":  [m.get("PrimaryURL", "")],
                  })

          print(f"[trivy] Sending {len(findings)} findings (vuln + secret + misconfig)")

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": scan_id,
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 4. Horusec ───────────────────────────────────────────
  horusec:
    name: SAST — Horusec
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Horusec
        run: |
          # Install Horusec — try multiple stable versions with checksum verify
          install_horusec() {
            local VERSION=$1
            local URL="https://github.com/ZupIT/horusec/releases/download/${VERSION}/horusec_linux_amd64"
            echo "[horusec] Trying version ${VERSION}..."
            wget -q --timeout=30 "$URL" -O /tmp/horusec_bin && \
              chmod +x /tmp/horusec_bin && \
              /tmp/horusec_bin version 2>/dev/null && \
              mv /tmp/horusec_bin /usr/local/bin/horusec && \
              return 0
            return 1
          }

          # Try versions in order of preference
          install_horusec "v2.9.0-beta.3" || \
          install_horusec "v2.8.0" || \
          install_horusec "v2.7.3" || \
          (curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash) || \
          true

          # Verify installation
          if ! command -v horusec &>/dev/null; then
            echo "[horusec] Installation failed — creating empty result"
            echo '{"analysisVulnerabilities": []}' > horusec-results.json
          else
            echo "[horusec] Installed: $(horusec version 2>/dev/null || echo unknown)"
          # Run Horusec — disable docker tools (CI environment)
          # -s LOW includes LOW severity findings too
          horusec start \
            -p . \
            -o json \
            -O horusec-results.json \
            --disable-docker true \
            --enable-git-history false \
            -s="LOW" \
            --timeout 180 \
            --log-level error \
            --ignore="**/node_modules/**,**/.next/**,**/dist/**" \
            || true
          fi
          # Ensure output file exists
          ls horusec-results.json 2>/dev/null || echo '{"analysisVulnerabilities": []}' > horusec-results.json
          echo "[horusec] Result file size: $(wc -c < horusec-results.json) bytes"

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          import re
          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[horusec] No valid SCAN_ID ({scan_id!r}), skipping")
              import sys; sys.exit(0)

          findings = []
          sev_map = {"CRITICAL":"critical","HIGH":"high","MEDIUM":"medium","LOW":"low","INFO":"info","NOSEC":"info","UNKNOWN":"info"}

          # Try horusec JSON output
          for path in ["horusec-results.json"]:
              try:
                  with open(path) as f:
                      raw = f.read().strip()
                  if not raw or raw == "{}":
                      continue
                  data = json.loads(raw)
              except Exception as e:
                  print(f"[horusec] Could not parse {path}: {e}")
                  continue

              # Handle both array and object formats
              items = []
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  items = data.get("analysisVulnerabilities") or []

              for item in items:
                  # Handle nested or flat structure
                  if isinstance(item, dict) and "vulnerabilities" in item:
                      v = item["vulnerabilities"]
                  elif isinstance(item, dict) and "severity" in item:
                      v = item
                  else:
                      continue

                  sev_raw = str(v.get("severity", "MEDIUM")).upper()
                  title = v.get("details", v.get("title", v.get("description", "Horusec finding")))
                  if title:
                      title = str(title)[:120]
                  else:
                      title = "Horusec finding"

                  line = v.get("line", v.get("lineNumber", 0))
                  try:
                      line_num = int(line) if line else None
                  except (ValueError, TypeError):
                      line_num = None

                  file_path = v.get("file", v.get("filename", v.get("commitAuthor", "")))

                  findings.append({
                      "tool": "horusec",
                      "ruleId": str(v.get("rule_id", v.get("securityTool", "horusec"))),
                      "title": title,
                      "description": str(v.get("details", v.get("description", "")))[:500],
                      "severity": sev_map.get(sev_raw, "medium"),
                      "filePath": str(file_path) if file_path else None,
                      "lineStart": line_num,
                      "codeSnippet": str(v.get("code", ""))[:400]
                  })

          print(f"[horusec] Found {len(findings)} findings")

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": scan_id,
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"[horusec] Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 5. Bearer ────────────────────────────────────────────
  bearer:
    name: SAST — Bearer
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Bearer
        uses: bearer/bearer-action@v2
        with:
          format: json
          output: bearer-results.json
          exit-code: "0"
          severity: critical,high,medium
          skip-rule: CWE-532
        continue-on-error: true

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          try:
              with open("bearer-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          import re
          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[bearer] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          sev_map = {"critical":"critical","high":"high","medium":"medium","low":"low","warning":"low"}

          # Rules to always skip — known noise in Next.js/Node projects
          SKIP_RULES = {
              "javascript_lang_logger",
              "javascript_lang_session",
              "CWE-532",
          }

          findings = []
          seen = set()

          for sev_key, items in data.items():
              if not isinstance(items, list):
                  continue
              # Skip low severity keys entirely
              if sev_key not in ("critical", "high", "medium"):
                  continue
              for r in items:
                  rule_id = r.get("rule_id", "")
                  # Skip noise rules
                  if rule_id in SKIP_RULES:
                      continue
                  cwe_ids = r.get("cwe_ids", [])
                  if isinstance(cwe_ids, list) and any(c in SKIP_RULES for c in cwe_ids):
                      continue

                  # Dedup
                  dedup = f"{rule_id}::{r.get('filename', '')}::{r.get('line_number', '')}"
                  if dedup in seen:
                      continue
                  seen.add(dedup)

                  findings.append({
                      "tool":        "bearer",
                      "ruleId":      rule_id,
                      "title":       r.get("title", "Bearer finding"),
                      "description": r.get("description", r.get("detail", ""))[:500],
                      "severity":    sev_map.get(sev_key, "medium"),
                      "filePath":    r.get("filename", ""),
                      "lineStart":   r.get("line_number"),
                      "cweId":       cwe_ids[0] if cwe_ids else "",
                      "owaspCategory": r.get("owasp", {}).get("name", "") if isinstance(r.get("owasp"), dict) else "",
                  })

          print(f"[bearer] Sending {len(findings)} findings (noise filtered)")

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": scan_id,
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 6. NodeJsScan ────────────────────────────────────────
  nodejsscan:
    name: SAST — NodeJsScan
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run NodeJsScan
        run: |
          # NodeJsScan — only meaningful for JS/TS/Node projects
          JS_COUNT=$(find . -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" | grep -v node_modules | grep -v .next | wc -l)
          echo "[nodejsscan] JS/TS files found: $JS_COUNT"
          if [ "$JS_COUNT" -gt "0" ]; then
            # Added break-system-packages to prevent CI crash on Ubuntu 24.04
            pip install nodejsscan --quiet --break-system-packages || true
            python3 -c "
          import subprocess, json, sys, os
          # Run nodejsscan with exclusions for generated/vendor dirs
          result = subprocess.run(
              ['nodejsscan', '-d', '.', '-o', 'nodejsscan-results.json',
               '--exclude', 'node_modules',
               '--exclude', '.next',
               '--exclude', 'dist',
               '--exclude', '.git'],
              capture_output=True, text=True, timeout=180
          )
          print('[nodejsscan] return code:', result.returncode)
          if result.stdout:
              print('[nodejsscan] stdout:', result.stdout[:500])
          # Try alternate output paths
          if not os.path.exists('nodejsscan-results.json'):
              for f in ['output.json', 'results.json', 'report.json']:
                  if os.path.exists(f):
                      os.rename(f, 'nodejsscan-results.json')
                      print(f'[nodejsscan] Renamed {f} to nodejsscan-results.json')
                      break
          # Validate JSON
          if os.path.exists('nodejsscan-results.json'):
              try:
                  with open('nodejsscan-results.json') as f:
                      d = json.load(f)
                  total = sum(len(v) for v in d.values() if isinstance(v, list))
                  print(f'[nodejsscan] Valid JSON, approximately {total} findings')
              except Exception as e:
                  print(f'[nodejsscan] JSON parse error: {e}')
                  open('nodejsscan-results.json', 'w').write('{}')
          " || true
          else
            echo "[nodejsscan] No JS/TS files, skipping"
          fi
          ls -la nodejsscan-results.json 2>/dev/null || echo '{}' > nodejsscan-results.json

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          import re
          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[nodejsscan] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          findings = []

          try:
              with open("nodejsscan-results.json") as f:
                  raw = f.read().strip()
              data = json.loads(raw) if raw and raw != '{}' else {}
          except Exception as e:
              print(f"[nodejsscan] Parse error: {e}")
              data = {}

          # NodeJsScan JSON structure: {"nodejs_security_findings": [...], "template_findings": [...], ...}
          # Each finding: {"title": ..., "description": ..., "tag": ..., "filename": ..., "line": ..., "lines": ...}
          sev_map = {
              "critical": "critical", "high": "high",
              "medium": "medium", "low": "low",
              "good": "info", "warning": "medium"
          }

          # Keys that contain actual findings (lists of dicts)
          finding_keys = [
              "nodejs_security_findings", "template_findings",
              "nodejs_security_bugs", "error_findings"
          ]

          for key in finding_keys:
              items = data.get(key, [])
              if not isinstance(items, list):
                  continue
              for r in items:
                  if not isinstance(r, dict):
                      continue
                  sev_raw = str(r.get("severity", r.get("tag", "medium"))).lower()
                  title = r.get("title", r.get("description", "NodeJsScan finding"))
                  findings.append({
                      "tool": "nodejsscan",
                      "ruleId": str(r.get("tag", r.get("rule_id", ""))),
                      "title": str(title)[:120] if title else "NodeJsScan finding",
                      "description": str(r.get("description", ""))[:500],
                      "severity": sev_map.get(sev_raw, "medium"),
                      "filePath": str(r.get("filename", r.get("path", ""))) or None,
                      "lineStart": int(r["line"]) if r.get("line") else None,
                      "codeSnippet": str(r.get("lines", r.get("code", "")))[:400]
                  })

          # Also check top-level list format
          if not findings and isinstance(data, list):
              for r in data:
                  if not isinstance(r, dict): continue
                  findings.append({
                      "tool": "nodejsscan",
                      "ruleId": str(r.get("tag", "")),
                      "title": str(r.get("title", "NodeJsScan finding"))[:120],
                      "description": str(r.get("description", ""))[:500],
                      "severity": "medium",
                      "filePath": str(r.get("filename", "")) or None,
                      "lineStart": int(r["line"]) if r.get("line") else None,
                  })

          print(f"[nodejsscan] Found {len(findings)} findings")

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": scan_id,
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 7. CodeQL ────────────────────────────────────────────
  codeql:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          upload: false

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request, glob, subprocess, re

          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[codeql] No valid SCAN_ID ({scan_id!r}), skipping")
              import sys; sys.exit(0)

          findings = []

          # Use `find` to locate ALL .sarif files on the runner — most reliable
          try:
              result = subprocess.run(
                  ["find", "/home/runner/work", ".", "-name", "*.sarif", "-type", "f"],
                  capture_output=True, text=True, timeout=10
              )
              found_by_find = [l.strip() for l in result.stdout.splitlines() if l.strip()]
          except Exception:
              found_by_find = []

          # Also try glob patterns as fallback
          sarif_patterns = [
              "codeql-results/**/*.sarif",
              "codeql-results/*.sarif",
              "results/**/*.sarif",
              "*.sarif",
          ]
          found_by_glob = []
          for pattern in sarif_patterns:
              found_by_glob.extend(glob.glob(pattern, recursive=True))

          sarif_files = list(set(found_by_find + found_by_glob))
          print(f"[codeql] Found SARIF files: {sarif_files}")

          sev_map = {
              "error": "high", "warning": "medium",
              "note": "low", "none": "info",
              "fail": "high", "open": "medium", "review": "low"
          }

          for sarif_file in sarif_files:
              try:
                  with open(sarif_file) as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"[codeql] Could not parse {sarif_file}: {e}")
                  continue

              for run in data.get("runs", []):
                  driver = run.get("tool", {}).get("driver", {})
                  rules = {
                      r["id"]: r
                      for r in driver.get("rules", [])
                  }

                  for result in run.get("results", []):
                      rule_id = result.get("ruleId", "")
                      rule = rules.get(rule_id, {})

                      # Get title from multiple fallback sources
                      title = (
                          rule.get("shortDescription", {}).get("text") or
                          rule.get("name") or
                          result.get("message", {}).get("text", "")[:80] or
                          rule_id or
                          "CodeQL finding"
                      )

                      # Get description
                      desc = (
                          rule.get("fullDescription", {}).get("text") or
                          result.get("message", {}).get("text", "")
                      )[:500]

                      # Get severity from rule properties or result level
                      sev_raw = (
                          rule.get("properties", {}).get("problem.severity") or
                          rule.get("properties", {}).get("severity") or
                          result.get("level") or
                          result.get("kind") or
                          "warning"
                      ).lower()

                      # Get location
                      locs = result.get("locations", [])
                      loc = locs[0].get("physicalLocation", {}) if locs else {}
                      file_uri = loc.get("artifactLocation", {}).get("uri", "")
                      region = loc.get("region", {})
                      line_start = region.get("startLine")
                      line_end = region.get("endLine")

                      # Skip if no meaningful title or location
                      if not title or title == rule_id:
                          continue

                      findings.append({
                          "tool": "codeql",
                          "ruleId": rule_id,
                          "title": str(title)[:120],
                          "description": str(desc),
                          "severity": sev_map.get(sev_raw, "medium"),
                          "filePath": file_uri or None,
                          "lineStart": line_start,
                          "lineEnd": line_end,
                          "cweId": next(
                              (t for t in rule.get("properties", {}).get("tags", [])
                               if isinstance(t, str) and t.startswith("CWE-")),
                              ""
                          ) if isinstance(rule.get("properties", {}).get("tags"), list) else ""
                      })

          print(f"[codeql] Total findings: {len(findings)}")

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": scan_id,
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

# ── Bandit ───────────────────────────────────────────────
  bandit:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit (Python only)
        run: |
          PY_COUNT=$(find . -name "*.py" -not -path "./node_modules/*" -not -path "./.git/*" | wc -l)
          echo "[bandit] Python files found: $PY_COUNT"
          if [ "$PY_COUNT" -gt "0" ]; then
            pipx run bandit -r . -f json -o bandit-results.json --exclude ./node_modules,./venv,./.venv,./env -ll || true
          else
            echo '{"results": [], "errors": [], "metrics": {}}' > bandit-results.json
            echo "[bandit] No Python files found, skipping scan"
          fi
          ls bandit-results.json 2>/dev/null || echo '{"results": []}' > bandit-results.json

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request, re

          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[bandit] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          try:
              with open("bandit-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {"results": []}

          sev_map = {"HIGH": "high", "MEDIUM": "medium", "LOW": "low", "UNDEFINED": "info"}
          findings = []
          for r in data.get("results", []):
              findings.append({
                  "tool": "bandit",
                  "ruleId": r.get("test_id", ""),
                  "title": r.get("test_name", "Bandit finding"),
                  "description": r.get("issue_text", "")[:500],
                  "severity": sev_map.get(r.get("issue_severity", "MEDIUM"), "medium"),
                  "filePath": r.get("filename", ""),
                  "lineStart": r.get("line_number")
              })

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": scan_id,
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req) as res:
                  print(f"[bandit] Webhook: {res.status}")
          except Exception as e:
              print(f"[bandit] Webhook failed: {e}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── Gosec ────────────────────────────────────────────────
  gosec:
    name: SAST — Gosec
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Gosec (Go only)
        run: |
          # Only run if Go files exist
          GO_COUNT=$(find . -name "*.go" -not -path "./node_modules/*" -not -path "./.git/*" | wc -l)
          echo "[gosec] Go files found: $GO_COUNT"
          if [ "$GO_COUNT" -gt "0" ]; then
            go install github.com/securego/gosec/v2/cmd/gosec@latest
            gosec -fmt json -out gosec-results.json ./... || true
          else
            echo '{"Issues": [], "Stats": {"files": 0, "lines": 0, "nosec": 0, "found": 0}}' > gosec-results.json
            echo "[gosec] No Go files found, skipping scan"
          fi
      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request, re
          
          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[gosec] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          try:
              with open("gosec-results.json") as f:
                  data = json.load(f)
          except: data = {}
          findings = []
          for r in data.get("Issues", []):
              findings.append({
                  "tool": "gosec", "ruleId": r.get("rule_id", ""),
                  "title": r.get("details", "Gosec finding")[:120],
                  "description": r.get("details", "")[:500],
                  "severity": "medium", "filePath": r.get("file", ""),
                  "lineStart": int(r.get("line", "0")) if str(r.get("line", "0")).isdigit() else None
              })
          payload = json.dumps({"event": "scan.completed", "scanId": os.environ["SCAN_ID"], "repository": os.environ["REPO"], "branch": os.environ["BRANCH"], "commitSha": os.environ["SHA"], "findings": findings})
          req = urllib.request.Request(os.environ["OCULS_WEBHOOK_URL"], data=payload.encode(), headers={"Content-Type": "application/json", "X-Oculs-Signature-256": "sha256=" + hmac.new(os.environ["OCULS_WEBHOOK_SECRET"].encode(), payload.encode(), hashlib.sha256).hexdigest()}, method="POST")
          urllib.request.urlopen(req)
          EOF
        env:
          OCULS_WEBHOOK_URL: ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── SonarScanner ─────────────────────────────────────────
  sonarscanner:
    name: SAST — SonarScanner
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Run SonarScanner (requires SONAR_TOKEN)
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "[sonarscanner] SONAR_TOKEN not set — skipping SonarCloud scan"
            echo '[]' > sonarscanner-results.json
            exit 0
          fi
          # Install sonar-scanner
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q sonar-scanner-cli-5.0.1.3006-linux.zip
          export PATH="$PWD/sonar-scanner-5.0.1.3006-linux/bin:$PATH"
          # Auto-detect project language
          if find . -name "*.js" -o -name "*.ts" | grep -v node_modules | head -1 | grep -q .; then
            SONAR_LANG="js,ts"
          elif find . -name "*.py" | head -1 | grep -q .; then
            SONAR_LANG="py"
          elif find . -name "*.java" | head -1 | grep -q .; then
            SONAR_LANG="java"
          else
            SONAR_LANG=""
          fi
          sonar-scanner \
            -Dsonar.projectKey="${REPO//\//_}" \
            -Dsonar.sources=. \
            -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.exclusions="**/node_modules/**,**/.git/**,**/dist/**,**/.next/**" \
            ${SONAR_LANG:+-Dsonar.language=$SONAR_LANG} \
            || true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request, re

          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[sonarscanner] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          payload = json.dumps({"event": "scan.completed", "scanId": scan_id, "repository": os.environ["REPO"], "branch": os.environ["BRANCH"], "commitSha": os.environ["SHA"], "findings": []})
          
          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"], 
              data=payload.encode(), 
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig}, 
              method="POST"
          )
          urllib.request.urlopen(req)
          EOF
        env:
          OCULS_WEBHOOK_URL: ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

# ============================================================
# DAST JOBS — require TARGET_URL secret
# ============================================================

  # ── 8. OWASP ZAP ─────────────────────────────────────────
  owasp-zap:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    if: ${{ github.event.inputs.target_url != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target_url || secrets.TARGET_URL }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-J zap-results.json"
        continue-on-error: true

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          try:
              with open("zap-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          sev_map = {"3":"critical","2":"high","1":"medium","0":"info"}
          findings = []
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  for inst in alert.get("instances", [{}])[:5]:
                      findings.append({
                          "tool": "owasp_zap",
                          "ruleId": alert.get("pluginid", ""),
                          "title": alert.get("alert", "ZAP finding"),
                          "description": alert.get("desc", "")[:500],
                          "severity": sev_map.get(str(alert.get("riskcode", "1")), "medium"),
                          "targetUrl": inst.get("uri", alert.get("url", "")),
                          "cweId": f"CWE-{alert.get('cweid', '')}" if alert.get("cweid") else "",
                          "references": [alert.get("reference", "")]
                      })

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 9. Nuclei ────────────────────────────────────────────
  nuclei:
    name: DAST — Nuclei
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    if: ${{ github.event.inputs.target_url != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Nuclei via Docker
        run: |
          docker run --rm -v "$PWD:/src" projectdiscovery/nuclei:latest \
            -u "$TARGET_URL_INPUT" \
            -severity critical,high,medium,low \
            -json-export /src/nuclei-results.json \
            -timeout 30 \
            -no-interactsh || true
          # Docker çıktısını okunabilir yapıyoruz
          sudo chown -R $USER:$USER nuclei-results.json || true

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          findings = []
          try:
              with open("nuclei-results.json") as f:
                  for line in f:
                      try:
                          r = json.loads(line.strip())
                      except Exception:
                          continue
                      findings.append({
                          "tool": "nuclei",
                          "ruleId": r.get("template-id", ""),
                          "title": r.get("info", {}).get("name", "Nuclei finding"),
                          "description": r.get("info", {}).get("description", "")[:500],
                          "severity": r.get("info", {}).get("severity", "medium"),
                          "targetUrl": r.get("matched-at", r.get("host", "")),
                          "cvssScore": str(r.get("info", {}).get("classification", {}).get("cvss-score", "")),
                          "cweId": (r.get("info", {}).get("classification", {}).get("cwe-id") or [""])[0],
                          "references": r.get("info", {}).get("reference", [])[:3]
                      })
          except Exception:
              pass

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 10. Nikto ────────────────────────────────────────────
  nikto:
    name: DAST — Nikto
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    if: ${{ github.event.inputs.target_url != '' }}
    steps:
      - name: Run Nikto
        run: |
          sudo apt-get install -y nikto
          nikto -h "${{ github.event.inputs.target_url || secrets.TARGET_URL }}" \
            -Format json \
            -output nikto-results.json \
            -timeout 60 || true

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          try:
              with open("nikto-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          findings = []
          for vuln in data.get("vulnerabilities", []):
              findings.append({
                  "tool": "nikto",
                  "ruleId": str(vuln.get("id", "")),
                  "title": vuln.get("msg", "Nikto finding")[:120],
                  "description": vuln.get("msg", ""),
                  "severity": "medium",
                  "targetUrl": vuln.get("url", os.environ.get("TARGET_URL", ""))
              })

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}
          TARGET_URL:           ${{ secrets.TARGET_URL }}

  # ── 11. Dirsearch ────────────────────────────────────────
  dirsearch:
    name: DAST — Dirsearch
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    if: ${{ github.event.inputs.target_url != '' }}
    steps:
      - name: Run Dirsearch
        run: |
          pipx install dirsearch
          dirsearch -u "${{ github.event.inputs.target_url || secrets.TARGET_URL }}" \
            -o dirsearch-results.json \
            --format json \
            -t 20 \
            --timeout 10 \
            -x 404,403 || true

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          try:
              with open("dirsearch-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          findings = []
          for target, results in data.items():
              for r in results:
                  status = r.get("status", 0)
                  if status in (200, 301, 302):
                      findings.append({
                          "tool": "dirsearch",
                          "ruleId": f"exposed-path-{status}",
                          "title": f"Exposed path found (HTTP {status}): {r.get('path', '')}",
                          "description": f"Path {r.get('path', '')} returned HTTP {status}",
                          "severity": "medium" if status == 200 else "low",
                          "targetUrl": r.get("url", target)
                      })

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 12. Testssl ──────────────────────────────────────────
  testssl:
    name: Infra — testssl.sh
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    if: ${{ github.event.inputs.target_url != '' }}
    steps:
      - name: Run testssl.sh
        run: |
          git clone --depth 1 https://github.com/drwetter/testssl.sh.git /tmp/testssl
          HOST=$(echo "${{ github.event.inputs.target_url || secrets.TARGET_URL }}" | sed 's|https\?://||' | cut -d/ -f1)
          /tmp/testssl/testssl.sh \
            --jsonfile testssl-results.json \
            --severity LOW \
            --quiet \
            "$HOST" || true

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          try:
              with open("testssl-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = []

          sev_map = {"CRITICAL":"critical","HIGH":"high","MEDIUM":"medium","LOW":"low","INFO":"info","OK":"info","WARN":"medium"}
          findings = []
          for item in (data if isinstance(data, list) else []):
              severity_raw = item.get("severity", "INFO")
              if severity_raw in ("OK", "INFO"):
                  continue
              findings.append({
                  "tool": "testssl",
                  "ruleId": item.get("id", ""),
                  "title": item.get("id", "testssl finding"),
                  "description": item.get("finding", "")[:500],
                  "severity": sev_map.get(severity_raw, "medium"),
                  "targetUrl": item.get("ip", os.environ.get("TARGET_URL", ""))
              })

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook response: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}
          TARGET_URL:           ${{ secrets.TARGET_URL }}

  # ── Nmap Vulners ─────────────────────────────────────────
  nmap_vulners:
    name: Infra — Nmap Vulners
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    if: ${{ github.event.inputs.target_url != '' }}
    steps:
      - name: Run Nmap + vulners NSE
        run: |
          sudo apt-get update -y && sudo apt-get install -y nmap || true
          # Extract a bare host from the target URL (strip scheme, path and port)
          RAW="${{ github.event.inputs.target_url || secrets.TARGET_URL }}"
          HOST=$(echo "$RAW" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:.*$##')
          echo "[nmap] Target host: $HOST"
          if [ -n "$HOST" ]; then
            # -sV service/version detection + vulners script; XML output for parsing
            nmap -sV --script vulners --top-ports 100 -oX nmap-results.xml "$HOST" || true
          fi
          ls -la nmap-results.xml 2>/dev/null || echo "<nmaprun></nmaprun>" > nmap-results.xml

      - name: POST Nmap findings
        if: always()
        run: |
          python3 - <<'EOF'
          import os, json, hmac, hashlib, urllib.request
          import xml.etree.ElementTree as ET

          findings = []
          try:
              tree = ET.parse("nmap-results.xml")
              root = tree.getroot()
              for host in root.findall("host"):
                  addr_el = host.find("address")
                  addr = addr_el.get("addr") if addr_el is not None else ""
                  for port in host.findall(".//port"):
                      portid = port.get("portid", "")
                      svc = port.find("service")
                      svc_name = svc.get("name", "") if svc is not None else ""
                      svc_ver = svc.get("version", "") if svc is not None else ""
                      # vulners script output sits under <script id="vulners">
                      for script in port.findall("script"):
                          if script.get("id") != "vulners":
                              continue
                          for table in script.findall(".//table"):
                              cve = sev = ""
                              for elem in table.findall("elem"):
                                  key = elem.get("key", "")
                                  if key == "id":
                                      cve = (elem.text or "").strip()
                                  elif key == "cvss":
                                      try:
                                          score = float((elem.text or "0").strip())
                                          sev = "critical" if score >= 9 else "high" if score >= 7 else "medium" if score >= 4 else "low"
                                      except ValueError:
                                          sev = "medium"
                              if cve:
                                  findings.append({
                                      "tool": "nmap_vulners",
                                      "ruleId": cve,
                                      "title": f"{cve} on {svc_name or 'service'} (port {portid})",
                                      "description": f"Vulnerable service {svc_name} {svc_ver} on {addr}:{portid}".strip(),
                                      "severity": sev or "medium",
                                      "targetUrl": f"{addr}:{portid}",
                                      "references": [f"https://vulners.com/cve/{cve}"] if cve.startswith("CVE-") else [],
                                  })
          except Exception as e:
              print(f"[nmap] Parse note: {e}")

          print(f"[nmap] Sending {len(findings)} findings")
          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })
          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req) as res:
                  print(f"[nmap] Webhook: {res.status}")
          except Exception as e:
              print(f"[nmap] Webhook failed: {e}")
          EOF
        env:
          OCULS_WEBHOOK_URL: ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

# ── ESLint Security ──────────────────────────────────────
  eslint-security:
    name: SAST — ESLint Security
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ESLint Security plugins
        run: |
          # Only run if JS/TS files exist
          JS_COUNT=$(find . -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" \
            | grep -v node_modules | grep -v .next | wc -l)
          echo "[eslint-security] JS/TS files: $JS_COUNT"

          if [ "$JS_COUNT" -eq "0" ]; then
            echo "[eslint-security] No JS/TS files, skipping"
            echo '[]' > eslint-security-results.json
          else
            # Install security plugins without touching existing node_modules
            npm install --no-save \
              eslint \
              eslint-plugin-security \
              eslint-plugin-no-unsanitized \
              @typescript-eslint/parser \
              2>/dev/null || true

            # Create temporary eslint config
            cat > .eslint-security.json << 'ESLINTCONF'
            {
              "parser": "@typescript-eslint/parser",
              "plugins": ["security", "no-unsanitized"],
              "rules": {
                "security/detect-object-injection": "warn",
                "security/detect-non-literal-regexp": "warn",
                "security/detect-non-literal-fs-filename": "warn",
                "security/detect-eval-with-expression": "error",
                "security/detect-no-csrf-before-method-override": "error",
                "security/detect-possible-timing-attacks": "warn",
                "security/detect-pseudoRandomBytes": "warn",
                "security/detect-new-buffer": "warn",
                "security/detect-unsafe-regex": "warn",
                "security/detect-buffer-noassert": "warn",
                "security/detect-child-process": "warn",
                "security/detect-disable-mustache-escape": "error",
                "no-unsanitized/method": "error",
                "no-unsanitized/property": "error"
              },
              "parserOptions": {
                "ecmaVersion": 2022,
                "sourceType": "module",
                "ecmaFeatures": {"jsx": true}
              },
              "ignorePatterns": ["node_modules/", ".next/", "dist/"]
            }
          ESLINTCONF

            # Run eslint and output JSON
            npx eslint \
              --config .eslint-security.json \
              --format json \
              --output-file eslint-security-results.json \
              --ext .js,.jsx,.ts,.tsx \
              --ignore-pattern "node_modules" \
              --ignore-pattern ".next" \
              --ignore-pattern "dist" \
              . 2>/dev/null || true

            ls -la eslint-security-results.json 2>/dev/null || echo '[]' > eslint-security-results.json
            echo "[eslint-security] Done"
          fi

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request, re

          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[eslint-security] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          try:
              with open("eslint-security-results.json") as f:
                  raw = f.read().strip()
              data = json.loads(raw) if raw else []
          except Exception as e:
              print(f"[eslint-security] Parse error: {e}")
              data = []

          # ESLint severity: 1=warn, 2=error
          SEV_MAP = {1: "medium", 2: "high"}

          # Map rule IDs to CWE
          RULE_CWE = {
              "security/detect-eval-with-expression":          "CWE-95",
              "security/detect-object-injection":              "CWE-94",
              "security/detect-non-literal-regexp":            "CWE-625",
              "security/detect-non-literal-fs-filename":       "CWE-73",
              "security/detect-possible-timing-attacks":       "CWE-362",
              "security/detect-pseudoRandomBytes":             "CWE-338",
              "security/detect-unsafe-regex":                  "CWE-400",
              "security/detect-child-process":                 "CWE-78",
              "security/detect-disable-mustache-escape":       "CWE-79",
              "security/detect-no-csrf-before-method-override":"CWE-352",
              "no-unsanitized/method":                         "CWE-79",
              "no-unsanitized/property":                       "CWE-79",
          }

          findings = []
          seen = set()

          for file_result in (data if isinstance(data, list) else []):
              file_path = file_result.get("filePath", "")
              for msg in file_result.get("messages", []):
                  rule_id  = msg.get("ruleId", "")
                  if not rule_id:
                      continue
                  severity = SEV_MAP.get(msg.get("severity", 1), "medium")
                  line     = msg.get("line")

                  dedup = f"{rule_id}::{file_path}::{line}"
                  if dedup in seen:
                      continue
                  seen.add(dedup)

                  findings.append({
                      "tool":        "semgrep",  # mapped to semgrep for UI consistency
                      "ruleId":      rule_id,
                      "title":       msg.get("message", rule_id)[:120],
                      "description": f"ESLint Security: {msg.get('message', '')}",
                      "severity":    severity,
                      "filePath":    file_path,
                      "lineStart":   line,
                      "lineEnd":     msg.get("endLine"),
                      "cweId":       RULE_CWE.get(rule_id, ""),
                  })

          print(f"[eslint-security] Sending {len(findings)} findings")

          payload = json.dumps({
              "event":      "scan.completed",
              "scanId":     scan_id,
              "repository": os.environ["REPO"],
              "branch":     os.environ["BRANCH"],
              "commitSha":  os.environ["SHA"],
              "findings":   findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"[eslint-security] Webhook: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── npm audit ─────────────────────────────────────────────
  npm-audit:
    name: SAST — npm audit
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm audit
        run: |
          # Only run if package.json exists
          if [ ! -f "package.json" ]; then
            echo "[npm-audit] No package.json, skipping"
            echo '{"vulnerabilities":{}}' > npm-audit-results.json
          else
            echo "[npm-audit] Running npm audit..."
            # npm audit exits non-zero if vulnerabilities found — capture both
            npm audit --json > npm-audit-results.json 2>/dev/null || true
            VUL_COUNT=$(python3 -c "
          import json
          try:
              d = json.load(open('npm-audit-results.json'))
              vulns = d.get('vulnerabilities', {})
              print(len(vulns))
          except: print(0)
            " 2>/dev/null || echo "0")
            echo "[npm-audit] Found $VUL_COUNT vulnerable packages"
          fi

      - name: Generate dependency graph
        run: |
          # Generate full transitive dependency tree for SBOM-style visibility
          if [ -f "package.json" ]; then
            npm install --ignore-scripts --prefer-offline 2>/dev/null || true
            npm ls --json --all > npm-dep-graph.json 2>/dev/null || echo '{}' > npm-dep-graph.json
            DEP_COUNT=$(python3 -c "
          import json
          try:
              d = json.load(open('npm-dep-graph.json'))
              def count(node):
                  deps = node.get('dependencies', {}) or {}
                  return len(deps) + sum(count(v) for v in deps.values())
              print(count(d))
          except: print(0)
            " 2>/dev/null || echo "0")
            echo "[dep-graph] Total dependencies (including transitive): $DEP_COUNT"
          fi

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request, re

          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[npm-audit] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          try:
              with open("npm-audit-results.json") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"[npm-audit] Parse error: {e}")
              data = {}

          SEV_MAP = {
              "critical": "critical",
              "high":     "high",
              "moderate": "medium",
              "low":      "low",
              "info":     "info",
          }

          findings = []
          seen = set()

          for pkg_name, vuln in (data.get("vulnerabilities") or {}).items():
              severity_raw = vuln.get("severity", "low")
              severity     = SEV_MAP.get(severity_raw, "medium")

              # Report all severities but tag low/info differently
              # Transitive deps included — npm audit --json already covers them
              if severity_raw in ("info",):
                  continue

              via = vuln.get("via", [])
              # `via` can be list of strings (transitive) or list of dicts (direct)
              cve_ids = []
              advisories = []
              for v in via:
                  if isinstance(v, dict):
                      url = v.get("url", "")
                      if url:
                          advisories.append(url)
                      cve = v.get("cve")
                      if cve:
                          if isinstance(cve, list):
                              cve_ids.extend(cve)
                          else:
                              cve_ids.append(str(cve))

              title = f"{pkg_name}: {vuln.get('title', severity_raw + ' severity vulnerability')}"
              dedup = f"{pkg_name}::{severity_raw}"
              if dedup in seen:
                  continue
              seen.add(dedup)

              # Detect if this is a transitive (indirect) dependency
              is_direct = not vuln.get("isDirect") is False
              dep_type = "direct" if is_direct else "transitive"
              findings.append({
                  "tool":        "trivy",  # mapped to trivy for UI grouping
                  "ruleId":      cve_ids[0] if cve_ids else f"npm-{pkg_name}",
                  "title":       title[:120],
                  "description": (vuln.get("detail", vuln.get("overview", "")) or "") + f" [{dep_type} dependency]",
                  "severity":    severity,
                  "filePath":    "package.json",
                  "cweId":       "",
                  "references":  advisories[:3],
              })

          print(f"[npm-audit] Sending {len(findings)} findings (medium+)")

          payload = json.dumps({
              "event":      "scan.completed",
              "scanId":     scan_id,
              "repository": os.environ["REPO"],
              "branch":     os.environ["BRANCH"],
              "commitSha":  os.environ["SHA"],
              "findings":   findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"[npm-audit] Webhook: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── detect-secrets ────────────────────────────────────────
  detect-secrets:
    name: Secrets — detect-secrets
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run detect-secrets
        run: |
          pip install detect-secrets --quiet --break-system-packages || true

          # Scan entire repo — detect-secrets finds custom API key patterns
          # that Gitleaks may miss
          detect-secrets scan \
            --exclude-files "package-lock.json" \
            --exclude-files "yarn.lock" \
            --exclude-files "*.min.js" \
            --exclude-files ".next" \
            --exclude-files "\.env\.example$" \
            --exclude-files "ScanModal\.tsx$" \
            --all-files \
            . > detect-secrets-results.json 2>/dev/null || \
          detect-secrets scan . > detect-secrets-results.json 2>/dev/null || true

          # Count findings
          python3 -c "
          import json
          try:
              d = json.load(open('detect-secrets-results.json'))
              results = d.get('results', {})
              count = sum(len(v) for v in results.values())
              print(f'[detect-secrets] Found {count} potential secrets in {len(results)} files')
          except Exception as e:
              print(f'[detect-secrets] Count error: {e}')
          " || true

          ls detect-secrets-results.json 2>/dev/null || echo '{"results":{}}' > detect-secrets-results.json

      - name: POST findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request, re

          scan_id = os.environ.get("SCAN_ID", "")
          if not scan_id or not re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', scan_id):
              print(f"[detect-secrets] No valid SCAN_ID, skipping")
              import sys; sys.exit(0)

          try:
              with open("detect-secrets-results.json") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"[detect-secrets] Parse error: {e}")
              data = {}

          findings = []
          seen = set()

          for file_path, secrets in (data.get("results") or {}).items():
              for secret in (secrets if isinstance(secrets, list) else []):
                  secret_type = secret.get("type", "Secret")
                  line        = secret.get("line_number")

                  dedup = f"{secret_type}::{file_path}::{line}"
                  if dedup in seen:
                      continue
                  seen.add(dedup)

                  # Severity based on secret type
                  high_types = {"Private Key", "RSA Private Key", "AWS Access Key ID",
                                "Amazon AWS Access Key ID", "Stripe Access Key",
                                "GitHub Personal Access Token", "Slack Token"}
                  severity = "critical" if secret_type in high_types else "high"

                  findings.append({
                      "tool":        "gitleaks",  # mapped to gitleaks for UI grouping
                      "ruleId":      secret_type.lower().replace(" ", "-"),
                      "title":       f"Potential secret: {secret_type}",
                      "description": f"Detected '{secret_type}' in {file_path} at line {line}",
                      "severity":    severity,
                      "filePath":    file_path,
                      "lineStart":   line,
                      "cweId":       "CWE-798",
                  })

          print(f"[detect-secrets] Sending {len(findings)} findings")

          payload = json.dumps({
              "event":      "scan.completed",
              "scanId":     scan_id,
              "repository": os.environ["REPO"],
              "branch":     os.environ["BRANCH"],
              "commitSha":  os.environ["SHA"],
              "findings":   findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"[detect-secrets] Webhook: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

  # ── 13-20: Remaining tools (wapiti, sqlmap, arachni, wpscan)
  # ────────────────────────────────────────────────────────────
  remaining-tools:
    name: SAST/DAST — Remaining Tools
    runs-on: ubuntu-latest
    needs: notify-start
    continue-on-error: true
    if: ${{ github.event.inputs.target_url != '' }}
    steps:
      - uses: actions/checkout@v4

      # ── Wapiti ──────────────────────────────────────────
      - name: Run Wapiti
        run: |
          pipx install wapiti3
          wapiti -u "${{ github.event.inputs.target_url || secrets.TARGET_URL }}" \
            -f json \
            -o wapiti-results.json \
            --max-scan-time 120 \
            --max-links-per-page 30 || true

      - name: POST Wapiti findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          try:
              with open("wapiti-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          findings = []
          for vuln_type, items in data.get("vulnerabilities", {}).items():
              for r in (items if isinstance(items, list) else []):
                  findings.append({
                      "tool": "wapiti",
                      "ruleId": vuln_type,
                      "title": f"Wapiti: {vuln_type}",
                      "description": r.get("info", "")[:500],
                      "severity": "medium",
                      "targetUrl": r.get("path", ""),
                      "cweId": r.get("wstg", [""])[0] if r.get("wstg") else ""
                  })

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

      # ── WPScan ──────────────────────────────────────────
      - name: Run WPScan
        run: |
          docker pull wpscanteam/wpscan:latest || true
          docker run --rm wpscanteam/wpscan \
            --url "${{ github.event.inputs.target_url || secrets.TARGET_URL }}" \
            --format json \
            --output /dev/stdout 2>/dev/null > wpscan-results.json || true

      - name: POST WPScan findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, hmac, hashlib, urllib.request

          try:
              with open("wpscan-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          findings = []
          for plugin_name, plugin in (data.get("plugins") or {}).items():
              for vuln in (plugin.get("vulnerabilities") or []):
                  findings.append({
                      "tool": "wpscan",
                      "ruleId": vuln.get("references", {}).get("cve", [""])[0],
                      "title": vuln.get("title", "WPScan finding"),
                      "description": vuln.get("title", ""),
                      "severity": "high",
                      "targetUrl": os.environ.get("TARGET_URL", ""),
                      "references": list(vuln.get("references", {}).get("url", []))[:3]
                  })

          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })

          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print(f"Webhook: {res.status}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}
          TARGET_URL:           ${{ secrets.TARGET_URL }}

      # ── SQLmap ──────────────────────────────────────────
      - name: Run SQLmap
        run: |
          pipx install sqlmap || pip install sqlmap || true
          # --batch = non-interactive; --crawl discovers params from the target
          sqlmap -u "${{ github.event.inputs.target_url || secrets.TARGET_URL }}" \
            --batch \
            --crawl=2 \
            --level=2 \
            --risk=1 \
            --timeout=15 \
            --output-dir=./sqlmap-out \
            --results-file=sqlmap-results.csv || true
          ls -la sqlmap-results.csv 2>/dev/null || echo "" > sqlmap-results.csv

      - name: POST SQLmap findings
        if: always()
        run: |
          python3 - <<'EOF'
          import os, csv, json, hmac, hashlib, urllib.request

          findings = []
          try:
              with open("sqlmap-results.csv", newline="") as f:
                  for row in csv.DictReader(f):
                      target = row.get("Target URL") or row.get("target") or ""
                      param  = row.get("Parameter") or row.get("parameter") or ""
                      if not target and not param:
                          continue
                      findings.append({
                          "tool": "sqlmap",
                          "ruleId": "sql-injection",
                          "title": f"SQL injection in parameter '{param}'" if param else "SQL injection detected",
                          "description": f"SQLmap confirmed an injectable parameter on {target}.",
                          "severity": "critical",
                          "targetUrl": target,
                          "cweId": "CWE-89",
                          "owaspCategory": "A03:2021 - Injection",
                      })
          except Exception as e:
              print(f"[sqlmap] Parse note: {e}")

          print(f"[sqlmap] Sending {len(findings)} findings")
          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })
          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req) as res:
                  print(f"[sqlmap] Webhook: {res.status}")
          except Exception as e:
              print(f"[sqlmap] Webhook failed: {e}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}

      # ── Arachni ─────────────────────────────────────────
      - name: Run Arachni
        run: |
          # Official Arachni Docker image; output a binary report then convert to JSON
          docker run --rm -e TARGET_URL_INPUT -v "$PWD:/out" arachni/arachni:latest \
            bash -c 'arachni "$TARGET_URL_INPUT" \
              --timeout 00:05:00 \
              --report-save-path=/out/arachni.afr && \
              arachni_reporter /out/arachni.afr --reporter=json:outfile=/out/arachni-results.json' \
            || true
          ls -la arachni-results.json 2>/dev/null || echo '{}' > arachni-results.json

      - name: POST Arachni findings
        if: always()
        run: |
          python3 - <<'EOF'
          import os, json, hmac, hashlib, urllib.request

          try:
              with open("arachni-results.json") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          SEV_MAP = {"high": "high", "medium": "medium", "low": "low", "informational": "info"}
          findings = []
          for issue in (data.get("issues") or []):
              sev = SEV_MAP.get(str(issue.get("severity", "")).lower(), "medium")
              vector = issue.get("vector") or {}
              findings.append({
                  "tool": "arachni",
                  "ruleId": issue.get("check", {}).get("shortname", "") or issue.get("name", ""),
                  "title": issue.get("name", "Arachni finding"),
                  "description": (issue.get("description", "") or "")[:500],
                  "severity": sev,
                  "targetUrl": vector.get("action", "") or issue.get("referring_page", {}).get("dom", {}).get("url", ""),
                  "cweId": f"CWE-{issue.get('cwe')}" if issue.get("cwe") else "",
              })

          print(f"[arachni] Sending {len(findings)} findings")
          payload = json.dumps({
              "event": "scan.completed",
              "scanId": os.environ["SCAN_ID"],
              "repository": os.environ["REPO"],
              "branch": os.environ["BRANCH"],
              "commitSha": os.environ["SHA"],
              "findings": findings
          })
          secret = os.environ["OCULS_WEBHOOK_SECRET"].encode()
          sig = "sha256=" + hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["OCULS_WEBHOOK_URL"],
              data=payload.encode(),
              headers={"Content-Type": "application/json", "X-Oculs-Signature-256": sig},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req) as res:
                  print(f"[arachni] Webhook: {res.status}")
          except Exception as e:
              print(f"[arachni] Webhook failed: {e}")
          EOF
        env:
          OCULS_WEBHOOK_URL:    ${{ secrets.OCULS_WEBHOOK_URL }}
          OCULS_WEBHOOK_SECRET: ${{ secrets.OCULS_WEBHOOK_SECRET }}
          TARGET_URL:           ${{ secrets.TARGET_URL }}

# ============================================================
# Notify webhook that the scan has completed (all jobs done)
# ============================================================
  notify-complete:
    name: Notify — scan.completed (summary)
    runs-on: ubuntu-latest
    needs:
      - semgrep
      - gitleaks
      - trufflehog
      - trivy
      - horusec
      - bearer
      - nodejsscan
      - codeql
      - bandit
      - gosec
      - sonarscanner
      - owasp-zap
      - nuclei
      - nikto
      - dirsearch
      - testssl
      - nmap_vulners
      - eslint-security
      - npm-audit
      - detect-secrets
      - remaining-tools
    if: always()
    steps:
      - name: POST scan summary
        run: |
          STATUS="completed"
          PAYLOAD='{"event":"scan.completed","scanId":"'"$SCAN_ID"'","repository":"'"$REPO"'","branch":"'"$BRANCH"'","commitSha":"'"$SHA"'","final":true,"findings":[]}'
          SIG="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac '${{ secrets.OCULS_WEBHOOK_SECRET }}' | awk '{print $2}')"
          curl -fsSL -X POST "${{ secrets.OCULS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Oculs-Signature-256: $SIG" \
            -d "$PAYLOAD" || true